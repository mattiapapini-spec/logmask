id: acronis
label: Acronis Cyber Protect / EDR
version: '2026.07'
aliases:
- acronis_edr
- cyber_protect
fingerprints:
- pattern: ^machine_id$
  weight: 3
- pattern: ^machine_name$
  weight: 5
- pattern: ^alert_type$
  weight: 3
- pattern: ^tenant_uuid$
  weight: 2
- pattern: ^protection_status$
  weight: 2
rules:
- pattern: ^(machine_name|hostname|computer_name|device_name|endpoint_name)$
  action: mask
  kind: endpoint
- pattern: ^(machine_ip|ip_address|source_ip|destination_ip|src_ip|dst_ip)$
  action: mask
  kind: ip
- pattern: ^(user_name|username|account_name|user)$
  action: mask
  kind: user
- pattern: ^(command_line|process_path|file_path|url|message|description|details)$
  action: text
- pattern: ^(machine_id|tenant_uuid|customer_id|device_id|alert_id)$
  action: mask
  kind: opaque
- pattern: ^(alert_type|severity|status|protection_status|created_at|updated_at|event_time|process_id)$
  action: keep
- pattern: ^(sha1|sha256|md5|file_hash)$
  action: keep
header_hints:
- acronis
- cyber protect
notes: ''
