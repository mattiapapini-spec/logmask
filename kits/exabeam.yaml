header_hints:
- exabeam
- new-scale
- newscale
- advanced analytics
- data lake
notes: >-
  Exabeam New-Scale (Common Information Model 2.0), Advanced Analytics e Data
  Lake. Tutti i nomi di campo sono verificati sul repository ufficiale
  ExabeamLabs/CIMLibrary - Fields_Descriptions.md (1165 campi) e
  MetaFieldsMappings.md (88 metadati m_*). I campi custom c_* non hanno regola
  di proposito: il contenuto lo decide il cliente, quindi restano non
  classificati ed elisi in Safe mode. connection_uid e' documentato come md5 di
  IP + nome utente: pseudonimo ma ricalcolabile, quindi mascherato.
