# ===================================================================== IOC
- pattern: ^(file_hash|hash_md5|hash_sha1|hash_sha256|hash_sha256_at|process_hash|new_hash|old_hash|parent_hash_sha256|parent_md5hash|parent_process_hash|target_hash_sha256|target_md5hash|selected_hash_sha256|selected_md5hash|module_hash_names|file_signature|host_key)$
  action: keep
# ============================================================== operativi
- pattern: ^(activity|activity_id|activity_type|action|outcome|operation|operation_type|method|direction|category|categories|category_id|event_code|event_id|event_name|event_category|event_subtype|event_time|log_time|log_name|log_source|log_severity|approx_?log_?time|occured_time|issue_time|start_time|end_time|expiry_time|flow_start_time|flow_end_time|processing_end_time|duration|platform|product|vendor|vendor_name|device_vendor|device_product|device_model|device_type|device_class|device_version|machine_type|os|os_type|os_version|severity|alert_severity|alert_status|alert_type|incident_status|priority|confidence_level|impact|risk_score|session_risk_score|score|user_threat_level|user_threat_certainty|user_privilege_level|user_privilege_category|logon_type|login_type|login_type_text|auth|auth_type|auth_method|auth_level|auth_package|auth_process|credential_type|app_protocol|protocol|connection_state|connection_status|connection_type|dest_port|src_port|dest_translated_port|src_translated_port|bytes|bytes_in|bytes_out|host_bytes_in|host_bytes_out|packets|packets_in|packets_out|count|url_count|page_count|num_pages|num_recipients|num_internal_recipients|num_external_recipients|attachment_count|attachment_size|http_response_code|dns_query_type|dns_record_type|dns_response_code|error_code|failure_code|execution_status|create_result|file_type|file_category|file_ext|src_file_ext|extension|hash_type|mime|web_content_type|malware_family|mitre_labels|mitre_technique|tactic_key|technique_key|cve_id|cvss_base_score|cvss_impact_score|exploit_code_maturity|security_criticality|encrypted|is_ransomware|is_outbound|domain_join|country|country_code|dest_country|src_country|dest_country_code|src_country_code|dest_external_country|src_external_country|mfa_country|orig_cc|timezone|meeting_timezone|browser|user_agent|user_agent_client|process_type|process_signed|process_integrity|file_signed|file_signature_status|identity_type|principal_type|member_type|added_member_type|removed_member_type|group_type|host_type|src_host_type|user_type|dest_user_type|key_type|key_status|key_length|token_issuer_type|src_product|src_vendor|src_resource_type|src_net_status|src_interface|src_network_type|allowed_user_types|employee_type|badge_status|card_status|device_size|host_key_alg|mac_alg|ip_lease_time|ip_reputation|dns_ip_flow|router_ip_flow|email_attachments_bytes|remote_location_country_code)$
