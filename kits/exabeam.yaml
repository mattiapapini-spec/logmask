- pattern: ^(session_id|session_order|session_name|alert_id|incident_id|case_id|rule_id|event_uid|correlation_id|doc_id|file_id|file_dir_id|directory_id|cloud_drive_id|inode|process_id|dest_process_id|src_process_id|parent_process_id|parent_process_guid|process_guid|thread_id|tenant_id|customer_id|organization_id|subscription_id|key_id|site_id|instance_id|container_id|cluster_name|datacenter_name|datastore_name|namespace|resource_name|resource_id|printer_id|printer_name|printer_sn)$
