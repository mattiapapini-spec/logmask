- pattern: ^(excluded|excepted|starred|quarantined|isolated|retained|changed|exported|escalation|blocked_action|verdict|impact|module|detection_method|forensics_artifact_type|traffic_direction|resolution_reason|resolution_status|playbook_run_status|approval_status|verification_status|verification_method|backlog_status)$
  action: keep
- pattern: .*_(time|date|timestamp|time_stamp|seen)$
  action: keep
- pattern: ^(last_modified|legacy_last_modified_on|last_modified_on|duration|ingestion_failure_duration|remaining_exception_period)$
  action: keep
- pattern: ^(api_name|agent_os_sub_type|app_technology|app-id|app_category|app_subcategory|cloud_identity_type|cloud_identity_sub-type|cloud_operation_type|cloud_resource_type|cloud_resource_sub-type|cloud_service_name|collector_type|host_os|identity_user_type|legacy_cloud_provider|legacy_event_type|vendor_product|threat_name|threat_family_name|user_agent|vulnerability_category|device_os_name|device_os_version|os_type|dest_os|src_os|protocol_names|log_source_type|observer_type|observer_sub_type|alert_provider)$
