- pattern: .*(_url|_urls|_link|_links|_uri)$
  action: text
- pattern: ^(url|uri|urls)$
  action: text
- pattern: .*_(cmd|cmdline)$
  action: text
- pattern: .*_path$
  action: text
- pattern: .*registry_(key|hive|value|value_type|data|full_key)$
  action: text
- pattern: ^(file_name|attachment_name|.*_filename)$
