- pattern: ^(region|region_id|timezone|country|country_code|source_geolocation|destination_geolocation|exposure_level|risk_rating|rating|sku_name|sku_tier)$
  action: keep
- pattern: ^(cgo_name|os_parent_name|legacy_target_process_name|process_names?|parent_process_name|source_process_name|target_process_name)$
  action: keep
- pattern: ^(phone_number|mobile_phone|work_phone|telephone_no\.?|contact_telephone_number)$
