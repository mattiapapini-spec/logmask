- pattern: ^(mitre_att&ck_tactic|mitre_att&ck_technique|mitre_tactic_id|mitre_tactic_name|mitre_technique_id|mitre_technique_name|technique_id|tactic_id|technique_display_name|cve|cve_id|cve_published|cvss.*|owasp_category)$
  action: keep
- pattern: ^(alert_type_id|detection_rule_id|attack_surface_rule_id|fw_rule_id|vendor_id)$
