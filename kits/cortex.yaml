rules:
# v0.25.1 - famiglia action_evtlog_*: ingestione dei Windows Event Log in
# Cortex XDR/XSIAM. Mancava del tutto: una query che proietta solo questi campi
# non faceva scattare il kit e il messaggio dell'evento - che contiene nomi
# utente, dominio, workstation e IP - usciva in chiaro (o eliso per intero in
# Safe mode, perdendo l'evidenza).
- pattern: ^action_evtlog_(message|description|rendering_?message|xml)$
  action: text
- pattern: ^(action_evtlog_data_fields|event_?data|action_evtlog_data)$
  action: text
- pattern: ^action_evtlog_(computer|computer_?name|host|host_?name|machine|machine_?name|workstation|workstation_?name)$
  action: mask
  kind: fqdn
- pattern: ^action_evtlog_(user_?name|subject_user_?name|target_user_?name|account_?name|caller_?user_?name|logon_?user)$
  action: mask
  kind: user
- pattern: ^action_evtlog_(domain|domain_?name|subject_domain_?name|target_domain_?name|account_?domain)$
  action: mask
  kind: windomain
- pattern: ^action_evtlog_(sid|subject_user_?sid|target_user_?sid|security_?id)$
  action: mask
  kind: opaque
- pattern: ^action_evtlog_(ip_?address|source_?(network_)?address|client_?address)$
  action: mask
  kind: ipv4
- pattern: ^action_evtlog_(event_id|level|task|opcode|record_?id|channel|provider_?name|provider_?guid|version|keywords|source_?name|category|logon_?type|status|sub_?status|process_?id|thread_?id)$
  action: keep
- pattern: ^_time$
  action: keep
- pattern: .*(last_)?external_ip(s|_address(es)?)?$
  action: mask
  kind: ip_strict
- pattern: ^(agent|host)_ip(_addresses)?(_v6)?$
  action: mask
  kind: ip
- pattern: ^action_(local|remote)_ip(_v6)?$
  action: mask
  kind: ip
- pattern: .*_ip(_v6)?$
  action: mask
  kind: ip
- pattern: .*_ip_addresses(_v6)?$
  action: mask
  kind: ip
- pattern: ^(agent_hostname|host_name|dst_host|src_host|endpoint_name)$
  action: mask
  kind: endpoint
- pattern: .*external_hostname$
  action: mask
  kind: fqdn
- pattern: .*dns_query(_name)?$
  action: mask
  kind: fqdn
- pattern: ^dns_(resolutions?|response_names?|answers?)$
  action: text
- pattern: ^_(product|vendor|time|reception_time|insert_time)$
  action: keep
- pattern: .*_country(_code|_name)?$
  action: keep
- pattern: ^(n|cnt|count|num|total|_count)$
  action: keep
- pattern: ^mailbox_?owner$
  action: mask
  kind: email
- pattern: ^(from|to_?recipients|cc_?recipients|bcc_?recipients|reply_?to|sender|internet_?message_?headers)$
  action: text
- pattern: ^(inference_?classification|has_?attachments|is_?read|is_?draft|importance|conversation_?index)$
  action: keep
- pattern: ^(actor|causality_actor|os_actor)_(effective|primary)_username$
  action: mask
  kind: user
- pattern: ^(user_name|username|identity_name|identity_invoked_by_name)$
  action: mask
  kind: user
- pattern: .*_(size|size_bytes|sizes|bytes|byte_count|length)$
  action: keep
- pattern: .*_(upload|download|uploads|downloads|packet|packets|pkt|pkts)$
  action: keep
- pattern: .*_process_image_name$
  action: keep
- pattern: .*_process_name$
  action: keep
- pattern: .*_process_image_path$
  action: text
- pattern: .*_file_name$
  action: text
- pattern: .*_username$
  action: mask
  kind: user
- pattern: ^auth(entication)?_(identity|user|principal|subject|upn|account|account_name)$
  action: mask
  kind: user
- pattern: ^auth(entication)?_(outcome|result|status|method|methods|type|types|stage|step|protocol|mechanism|service|client|scheme|factor|outcome_reason|failure_reason|reason)$
  action: keep
- pattern: ^identity_orig$
  action: mask
  kind: user
- pattern: ^(operation_name|operation_name_orig)$
  action: keep
- pattern: ^resource_type_orig$
  action: keep
- pattern: ^referenced_resource$
  action: mask
  kind: opaque
- pattern: ^referenced_resource_name$
  action: text
- pattern: ^identity_normalized$
  action: mask
  kind: user
- pattern: ^backtrace_identities$
  action: text
- pattern: ^domain_name$
  action: mask
  kind: fqdn
- pattern: ^caller_ip_asn$
  action: keep
- pattern: ^caller_ip_(asn_org|enrichment|geolocation)$
  action: text
- pattern: ^user_agent_data$
  action: keep
- pattern: ^issue_domain$
  action: keep
- pattern: .*_(user_)?domain$
  action: mask
  kind: windomain
- pattern: .*_sid$
  action: mask
  kind: sid
- pattern: ^(mac|mac_addresses)$
  action: mask
  kind: mac
- pattern: .*command_line$
  action: text
- pattern: .*_(file|image)_path$
  action: text
- pattern: .*registry_(key_name|data|full_key)$
  action: text
- pattern: ^(description|details|raw_log|_raw_log|message|alert_description)$
  action: text
- pattern: ^(agent_id|endpoint_id|host_id|alert_id|incident_id|case_id|story_id)$
  action: mask
  kind: opaque
- pattern: ^xdr_url$
  action: text
- pattern: ^sensor_name$
  action: mask
  kind: endpoint
- pattern: ^(tenant|client|cliente)$
  action: mask
  kind: opaque
- pattern: ^(source|type|severity|category|status|action|event_type|event_sub_type)$
  action: keep
- pattern: ^(event_timestamp|event_time|_time|timestamp|occurred|created|modified|ingestion_time)$
  action: keep
- pattern: ^(process_id|parent_process_id|thread_id|event_id|rule_id|policy_id)$
  action: keep
- pattern: ^(sha1|sha256|md5|file_hash|process_sha256|actor_process_image_sha256)$
  action: keep
- pattern: .*(sha256|sha1|sha512|md5|ssdeep|_hash)$
  action: keep
- pattern: .*(signer|signature|signature_status)s?$
