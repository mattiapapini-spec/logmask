services:
  logmask:
    build: .
    container_name: logmask
    ports:
      # LAN by default. Set LOGMASK_BIND=127.0.0.1 for host-only access.
      - "${LOGMASK_BIND:-0.0.0.0}:${LOGMASK_PORT:-8090}:8080"
    environment:
      LOGMASK_DATA: /data
      LOGMASK_ADMIN_USER: "${LOGMASK_ADMIN_USER:-admin}"
      # Optional. If empty, a random bootstrap password is written to
      # ./data/bootstrap-admin.txt on first start.
      LOGMASK_ADMIN_PASSWORD: "${LOGMASK_ADMIN_PASSWORD:-}"
      LOGMASK_COOKIE_SECURE: "${LOGMASK_COOKIE_SECURE:-false}"
      LOGMASK_SESSION_IDLE_SECONDS: "${LOGMASK_SESSION_IDLE_SECONDS:-1800}"
      LOGMASK_SESSION_MAX_SECONDS: "${LOGMASK_SESSION_MAX_SECONDS:-28800}"
      LOGMASK_LOGIN_MAX_FAILURES: "${LOGMASK_LOGIN_MAX_FAILURES:-5}"
      LOGMASK_LOGIN_WINDOW_SECONDS: "${LOGMASK_LOGIN_WINDOW_SECONDS:-900}"
      LOGMASK_MAX_BODY_BYTES: "${LOGMASK_MAX_BODY_BYTES:-12582912}"
      LOGMASK_MAX_FILE_BYTES: "${LOGMASK_MAX_FILE_BYTES:-8388608}"
    volumes:
      - ./data:/data
    restart: unless-stopped
